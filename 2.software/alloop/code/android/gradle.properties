org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true

# Network configuration for Maven repository access
systemProp.http.proxyHost=
systemProp.http.proxyPort=
systemProp.https.proxyHost=
systemProp.https.proxyPort=

# TLS configuration for secure connections
systemProp.https.protocols=TLSv1.2,TLSv1.3
systemProp.jdk.tls.client.protocols=TLSv1.2,TLSv1.3

# Gradle daemon configuration for better network handling
org.gradle.daemon=true
org.gradle.caching=true

# Kotlin incremental compilation disabled: file_picker 10.3.10 + Kotlin 2.1.0 + Flutter 3.41.9 Gradle plugin
# combination silently drops FilePickerPlugin.class from the compile-classpath JAR, causing
# GeneratedPluginRegistrant.java to fail with "cannot find symbol FilePickerPlugin".
kotlin.incremental=false
